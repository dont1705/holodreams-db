<html lang="zh-TW"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hololive Dreams圖鑑資料庫</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&family=Noto+Sans+TC:wght@400;600;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff6b8b; --primary-gradient: linear-gradient(135deg, #ff6b8b 0%, #ff8e53 100%);
            --secondary-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --bg-main: #0a0e1a; --bg-sidebar: #12182b; --bg-card: #182038; --bg-card-inner: #0f1527;
            --border-color: rgba(255, 255, 255, 0.08); --border-highlight: rgba(255, 107, 139, 0.4);
            --text-main: #f1f5f9; --text-sub: #94a3b8;
            --stat-total: #60a5fa; --stat-p: #f472b6; --stat-t: #38bdf8; --stat-s: #facc15;
            --type-happy: #f59e0b; --type-pure: #10b981; --type-cute: #ec4899;
            --skill-sp: #c084fc; --skill-a: #38bdf8; --skill-p: #fb923c; --skill-cloth: #ec4899; --skill-coop: #2dd4bf;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Outfit', 'Noto Sans TC', 'Noto Sans JP', sans-serif; background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; background-image: radial-gradient(circle at 10% 10%, rgba(255, 107, 139, 0.08) 0%, transparent 40%), radial-gradient(circle at 90% 90%, rgba(79, 172, 254, 0.08) 0%, transparent 40%); background-attachment: fixed; }
        
        header { background: rgba(18, 24, 43, 0.92); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border-color); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .brand { display: flex; align-items: center; gap: 14px; }
        .sidebar-toggle-btn { background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border-color); color: #fff; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
        .sidebar-toggle-btn:hover { background: var(--primary-gradient); border-color: transparent; box-shadow: 0 4px 12px rgba(255, 107, 139, 0.35); }
        .sidebar-toggle-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .brand-logo-img { height: 44px; object-fit: contain; }
        .brand-text h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px; }
        .brand-text p { font-size: 0.75rem; color: var(--text-sub); }

        .header-actions { display: flex; align-items: center; gap: 12px; }
        .header-search { position: relative; width: 260px; display: flex; gap: 8px;}
        .search-input-wrap { position: relative; flex: 1; }
        .search-input-wrap input { width: 100%; background: rgba(10, 14, 26, 0.8); border: 1px solid var(--border-color); border-radius: 12px; padding: 8px 14px 8px 36px; color: #fff; font-size: 0.88rem; outline: none; transition: all 0.2s; }
        .search-input-wrap input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255, 107, 139, 0.25); }
        .search-input-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; fill: var(--text-sub); }

        .btn-action { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border-color); color: #cbd5e1; padding: 8px 14px; border-radius: 10px; font-size: 0.85rem; font-weight: 700; font-family: inherit; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .btn-action:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
        .btn-primary { background: var(--primary-gradient); color: #fff; border: none; }
        .btn-filter.active { background: rgba(255, 107, 139, 0.2); border-color: var(--primary); color: #fff; box-shadow: 0 0 8px rgba(255, 107, 139, 0.3); }
        select.btn-action option { background: var(--bg-card); color: #fff; }
        .inline-edit-btn { background: rgba(255, 107, 139, 0.15); border: 1px solid rgba(255, 107, 139, 0.4); border-radius: 6px; cursor: pointer; padding: 2px 6px; font-size: 0.75rem; color: #fff; margin-left: 6px; transition: all 0.2s; }
        .inline-edit-btn:hover { background: var(--primary-gradient); border-color: transparent; }

        .filter-panel { background: rgba(18, 24, 43, 0.95); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border-color); padding: 16px 24px; display: none; gap: 15px; flex-wrap: wrap; align-items: flex-end; position: sticky; top: 69px; z-index: 99; animation: slideDown 0.2s ease-out; }
        .filter-panel.active { display: flex; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .filter-group { display: flex; flex-direction: column; gap: 6px; min-width: 140px; }
        .filter-group label { font-size: 0.8rem; font-weight: 700; color: var(--text-sub); }
        .filter-group select { background: rgba(10, 14, 26, 0.8); border: 1px solid var(--border-color); color: #fff; padding: 8px 12px; border-radius: 8px; font-family: inherit; font-size: 0.85rem; outline: none; cursor: pointer; }
        .filter-group select:focus { border-color: var(--primary); }

        .coop-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
        .coop-chip { background: rgba(10, 14, 26, 0.8); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; color: var(--text-sub); font-size: 0.85rem; font-weight: 700; transition: all 0.2s; font-family: inherit; }
        .coop-chip:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .coop-chip.active { background: rgba(45, 212, 191, 0.15); border-color: #2dd4bf; color: #fff; box-shadow: 0 0 8px rgba(45, 212, 191, 0.25); }
        .coop-chip img { width: 20px; height: 20px; object-fit: contain; border-radius: 4px; }

        .app-layout { display: flex; flex: 1; max-width: 1680px; width: 100%; margin: 0 auto; padding: 20px 24px; gap: 24px; transition: all 0.3s ease; }
        
        .sidebar { width: 350px; background: var(--bg-sidebar); border: 1px solid var(--border-color); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px; height: calc(100vh - 100px); position: sticky; top: 80px; overflow-y: auto; transition: width 0.3s ease, padding 0.3s ease, opacity 0.2s ease, transform 0.3s ease; }
        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
        .sidebar.collapsed { width: 0; padding: 0; margin: 0; border: none; overflow: hidden; opacity: 0; pointer-events: none; transform: translateX(-20px); }

        .gen-group { display: flex; flex-direction: column; gap: 4px; }
        .gen-group-header { font-size: 0.85rem; font-weight: 800; color: #ff8da6; padding: 8px 12px; background: rgba(255, 107, 139, 0.08); border-radius: 10px; display: flex; align-items: center; justify-content: space-between; text-transform: uppercase; margin-top: 4px; }
        .member-list { display: flex; flex-direction: column; gap: 4px; padding-left: 4px; margin-top: 4px; }
        .member-btn { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--text-sub); font-family: inherit; font-size: 0.86rem; font-weight: 600; cursor: pointer; transition: all 0.2s; text-align: left; }
        .member-btn:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
        .member-btn.active { background: rgba(255, 107, 139, 0.15); border-color: rgba(255, 107, 139, 0.35); color: #fff; font-weight: 700; }
        .member-btn .member-label { display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .member-btn .jp-subname { font-size: 0.76rem; color: #94a3b8; font-weight: normal; margin-left: 2px; }
        .member-btn.active .jp-subname { color: #fed7aa; }
        .member-btn .card-count-pill { font-size: 0.72rem; padding: 2px 7px; background: rgba(255, 255, 255, 0.08); border-radius: 99px; color: #cbd5e1; flex-shrink: 0; }

        .main-content { flex: 1; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
        .member-banner { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; }
        .member-banner-info { display: flex; align-items: center; gap: 18px; }
        .member-avatar-large { width: 60px; height: 60px; border-radius: 16px; background: var(--primary-gradient); display: flex; align-items: center; justify-content: center; font-size: 1.9rem; box-shadow: 0 6px 18px rgba(255, 107, 139, 0.3); overflow: hidden; }
        .member-banner-name h2 { font-size: 1.55rem; font-weight: 900; margin-bottom: 3px; }
        .member-banner-name .banner-jp { font-size: 1rem; color: #cbd5e1; font-weight: 600; margin-left: 6px; }
        .member-banner-name .gen-badge { display: inline-block; font-size: 0.8rem; font-weight: 700; padding: 3px 10px; border-radius: 8px; background: rgba(255, 107, 139, 0.2); color: #ff8da6; border: 1px solid rgba(255, 107, 139, 0.3); }

        .costume-tabs-wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .costume-tabs { display: flex; flex-wrap: wrap; gap: 10px; }
        .costume-tab-btn { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-sub); padding: 8px 16px; border-radius: 12px; font-family: inherit; font-size: 0.88rem; font-weight: 700; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px; }
        .costume-tab-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
        .costume-tab-btn.active { background: var(--primary-gradient); color: #fff; border-color: transparent; box-shadow: 0 4px 14px rgba(255, 107, 139, 0.35); }

        .type-pill { font-size: 0.72rem; font-weight: 800; padding: 2px 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 5px; }
        .type-pill img { width: 14px; height: 14px; object-fit: contain; }
        .type-happy { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
        .type-pure  { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
        .type-cute  { background: rgba(236, 72, 153, 0.2); color: #f472b6; border: 1px solid rgba(236, 72, 153, 0.4); }

        .detail-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 24px; padding: 24px; box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35); display: grid; grid-template-columns: 1.15fr 1fr; gap: 26px; position: relative; }
        .card-visual-col { display: flex; flex-direction: column; gap: 14px; }
        .card-top-header-bar { background: var(--bg-card-inner); border: 1px solid var(--border-color); border-radius: 16px; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .card-top-left-col { display: flex; flex-direction: column; gap: 4px; }
        .star-rating-top { color: #38bdf8; font-size: 1.15rem; letter-spacing: 2px; text-shadow: 0 0 8px rgba(56, 189, 248, 0.5); line-height: 1; }
        .card-top-title-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .card-top-title-group .card-title { font-size: 1.2rem; font-weight: 800; color: #fff; }
        .card-top-title-group .card-owner { font-size: 0.88rem; font-weight: 700; color: var(--text-sub); }

        .sign-toggle-btn { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border-color); color: #cbd5e1; padding: 7px 14px; border-radius: 10px; font-size: 0.82rem; font-weight: 700; font-family: inherit; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px; user-select: none; white-space: nowrap; }
        .sign-toggle-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
        .sign-toggle-btn.active { background: linear-gradient(135deg, rgba(255, 107, 139, 0.25), rgba(255, 209, 102, 0.25)); border-color: rgba(255, 107, 139, 0.5); color: #ffd166; box-shadow: 0 2px 10px rgba(255, 107, 139, 0.25); }

        .card-illustration-wrap { position: relative; width: 100%; height: 360px; border-radius: 18px; background: linear-gradient(135deg, #1e293b, #0f172a); border: 2px solid rgba(255, 255, 255, 0.1); overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: zoom-in; }
        .card-illustration-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        .card-illustration-wrap:hover .card-illustration-img { transform: scale(1.02); }
        .zoom-hint-tag { position: absolute; bottom: 10px; right: 12px; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(6px); padding: 4px 10px; border-radius: 8px; font-size: 0.72rem; font-weight: 700; color: var(--text-sub); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; }

        .banner-meta-tag { display: flex; align-items: center; gap: 14px; font-size: 0.8rem; color: var(--text-sub); padding: 8px 14px; background: rgba(0,0,0,0.25); border-radius: 10px; }
        .skill-box-cloth { background: rgba(236, 72, 153, 0.08); border: 1px solid rgba(236, 72, 153, 0.25); border-radius: 14px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; }
        .skill-cloth-badge { background: var(--skill-cloth); color: #fff; font-size: 0.75rem; font-weight: 800; padding: 4px 8px; border-radius: 6px; white-space: nowrap; flex-shrink: 0; }
        .skill-box-coop { background: rgba(45, 212, 191, 0.08); border: 1px solid rgba(45, 212, 191, 0.25); border-radius: 14px; padding: 14px 16px; display: flex; gap: 14px; align-items: center; }
        
        /* 🌸 Miko 把協力圖片變大囉！ */
        .coop-img-wrap { width: 85px; height: 85px; border-radius: 8px; overflow: hidden; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .coop-img-wrap img { width: 100%; height: 100%; object-fit: contain; }

        .card-stats-col { display: flex; flex-direction: column; gap: 16px; }
        .stat-controls-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--bg-card-inner); padding: 10px 14px; border-radius: 14px; border: 1px solid var(--border-color); }
        .bloom-selector { display: flex; align-items: center; gap: 6px; }
        .bloom-btn { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.05); color: #cbd5e1; font-weight: 800; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        .bloom-btn.active { background: var(--primary-gradient); color: #fff; border-color: transparent; box-shadow: 0 2px 8px rgba(255, 107, 139, 0.4); }

        .stats-grid { background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: rgba(255, 255, 255, 0.03); border-radius: 10px; transition: all 0.3s ease; }
        .stat-item.total { grid-column: span 2; background: rgba(96, 165, 250, 0.12); border: 1px solid rgba(96, 165, 250, 0.3); }
        .stat-label { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.85rem; }
        .stat-val { font-family: 'Outfit', monospace; font-size: 1.25rem; font-weight: 900; transition: color 0.3s ease; }

        .bloom-bonus-box { background: linear-gradient(135deg, rgba(255, 107, 139, 0.12), rgba(255, 209, 102, 0.12)); border: 1px dashed rgba(255, 107, 139, 0.35); border-radius: 12px; padding: 10px 14px; font-size: 0.82rem; color: #fecdd3; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .skills-list { display: flex; flex-direction: column; gap: 10px; }
        .skill-card { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-color); border-radius: 14px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; transition: all 0.3s ease; }
        .skill-icon-wrap { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.85rem; flex-shrink: 0; overflow: hidden; }
        .skill-icon-sp { background: rgba(192, 132, 252, 0.2); color: var(--skill-sp); border: 1px solid rgba(192, 132, 252, 0.4); }
        .skill-icon-a { background: rgba(56, 189, 248, 0.2); color: var(--skill-a); border: 1px solid rgba(56, 189, 248, 0.4); }
        .skill-icon-p { background: rgba(251, 146, 60, 0.2); color: var(--skill-p); border: 1px solid rgba(251, 146, 60, 0.4); }
        .skill-body { flex: 1; }
        .skill-type-tag { font-size: 0.72rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 3px; }
        .skill-desc { font-size: 0.88rem; color: #cbd5e1; line-height: 1.45; }

        .lightbox-backdrop, .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); display: none; align-items: center; justify-content: center; z-index: 300; }
        .lightbox-img-wrap { max-width: 90vw; max-height: 90vh; border-radius: 16px; overflow: hidden; box-shadow: 0 16px 48px rgba(0,0,0,0.8); border: 2px solid rgba(255,255,255,0.2); position: relative; }
        .lightbox-img { max-width: 90vw; max-height: 90vh; object-fit: contain; display: block; }
        .modal-box-large { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 24px; padding: 28px; max-width: 860px; width: 94%; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .modal-box-large::-webkit-scrollbar { width: 6px; }
        .modal-box-large::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: span 2; }
        .form-group label { font-size: 0.82rem; font-weight: 700; color: #cbd5e1; }
        .form-group input, .form-group select, .form-group textarea { background: rgba(10, 14, 26, 0.85); border: 1px solid var(--border-color); border-radius: 10px; color: #fff; padding: 9px 12px; font-family: inherit; font-size: 0.88rem; outline: none; transition: border-color 0.2s; }

        .form-section-title { font-size: 0.95rem; font-weight: 800; color: var(--primary); border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 6px; margin-top: 10px; }
        .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .settings-tabs { display: flex; gap: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px; overflow-x: auto; }
        .settings-tab-btn { background: transparent; border: none; color: var(--text-sub); font-size: 0.9rem; font-weight: 700; padding: 8px 12px; cursor: pointer; border-radius: 8px; white-space: nowrap; }
        .settings-tab-btn.active { background: rgba(255,107,139,0.15); color: #fff; }
        .settings-panel { display: none; flex-direction: column; gap: 15px; }
        .settings-panel.active { display: flex; }
        .list-item-row { display: flex; gap: 10px; align-items: center; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); }

        .update-log-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .update-log-item { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .update-log-header { display: flex; justify-content: space-between; align-items: center; }
        .update-log-date { font-weight: 800; color: #ff8da6; font-size: 0.9rem; }
        .update-log-content { font-size: 0.88rem; color: #cbd5e1; line-height: 1.5; white-space: pre-wrap; }
        
        .app-footer { margin-top: auto; padding: 24px; text-align: center; border-top: 1px solid var(--border-color); background: rgba(18, 24, 43, 0.9); color: var(--text-sub); font-size: 0.85rem; font-weight: 600; }
        
        @media (max-width: 1024px) {
            .app-layout { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: static; }
            .detail-card { grid-template-columns: 1fr; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full { grid-column: span 1; }
        }
    </style>
</head>
<body>

<header>
    <div class="brand">
        <button class="sidebar-toggle-btn" onclick="toggleSidebar()" title="開啟/關閉側邊欄">
            <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"></path></svg>
        </button>
        <img src="https://i.ibb.co/Tqv0Gr0P/holo.png" alt="Holo Dreams Logo" class="brand-logo-img">
        <div class="brand-text">
            <h1 data-i18n="title">HOLO Dreams非官方公式圖鑑</h1>
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 2px;">
                <p id="headerUpdateDate" class="clickable-date" onclick="openUpdateLogModal()" style="cursor:pointer; color:#ff8da6; text-decoration:underline; font-weight:700; transition:color 0.2s;">📝 更新紀錄</p>
                <p id="headerStatsCount" style="font-size: 0.75rem; color: #94a3b8; font-weight: 700;"></p>
            </div>
        </div>
    </div>
    <div class="header-actions">
        <select id="langSelect" onchange="changeLang(this.value)" class="btn-action" style="outline: none; cursor: pointer;">
            <option value="zh">🇹🇼 中文</option>
            <option value="jp">🇯🇵 日本語</option>
            <option value="en">🇺🇸 English</option>
        </select>

function t(key, ...args) { 
    let str = i18nData[currentLang][key] || i18nData['zh'][key] || key; 
    for(let i=0; i<args.length; i++) str = str.replace('{'+i+'}', args[i]); 
    return str; 
}

function getLoc(obj, key) {
    if (!obj) return "";
    let val = "";
    if (currentLang === 'en') { val = obj[key + 'En'] || obj[key + 'Jp'] || obj[key]; } 
    else if (currentLang === 'jp') { val = obj[key + 'Jp'] || obj[key]; } 
    else { val = obj[key]; }
    return val || "";
}

function getLocArray(arrBase, arrJp, arrEn, index) {
    let val = "";
    if (currentLang === 'en') { val = (arrEn && arrEn[index]) || (arrJp && arrJp[index]) || (arrBase && arrBase[index]); } 
    else if (currentLang === 'jp') { val = (arrJp && arrJp[index]) || (arrBase && arrBase[index]); } 
    else { val = arrBase && arrBase[index]; }
    return val || "";
}

function getMemberDisplayNames(mem, genId) {
    const isOverseas = genId.startsWith('en_') || genId.startsWith('id_');
    let primary = mem.name;
    let secondary = mem.jpName;
    const safeEnName = mem.enName || mem.name;
    const safeJpName = mem.jpName || mem.name;

    if (currentLang === 'en') {
        if (isOverseas) { primary = safeEnName; secondary = safeJpName; } 
        else { primary = safeEnName; secondary = ''; }
    } else if (currentLang === 'jp') {
        if (isOverseas) { primary = safeJpName; secondary = safeEnName; } 
        else { primary = safeJpName; secondary = ''; }
    } else {
        primary = mem.name; secondary = safeJpName;
    }
    if (primary === secondary) secondary = '';
    return { primary, secondary };
}

}

        try {

            parsed.forEach(g => {
                let hg = hcData.find(x => x.genId === g.genId);
                if (hg) {
                    g.members.forEach(m => {

                        if (hm && !m.enName) m.enName = hm.enName;
                    });
                }
            });
            return parsed;
        } catch(e) { }
    }

function getFilteredCostumes(mem) {
    if (!mem.costumes) return [];
    const text = document.getElementById('globalSearch').value.toLowerCase().trim();
    const pool = document.getElementById('filterPool') ? document.getElementById('filterPool').value : 'all';
    const type = document.getElementById('filterType') ? document.getElementById('filterType').value : 'all';
    const star = document.getElementById('filterStar') ? document.getElementById('filterStar').value : 'all';
    const maxStat = document.getElementById('filterMaxStat') ? document.getElementById('filterMaxStat').value : 'all';
    const outfitStat = document.getElementById('filterOutfitStat') ? document.getElementById('filterOutfitStat').value : 'all';
    const outfitScore = document.getElementById('filterOutfitScore') ? document.getElementById('filterOutfitScore').value : 'all';
    const outfitGen = document.getElementById('filterOutfitGen') ? document.getElementById('filterOutfitGen').value : 'all';
    const coop = window.currentCoopFilter || 'all';
    
    return mem.costumes.filter(c => {
        let match = true;
        if (pool !== 'all' && c.gachaPool !== pool) match = false;
        if (type !== 'all' && c.type !== type) match = false;
        if (star !== 'all' && c.rarity != star) match = false;
        if (coop !== 'all' && c.coopImgUrl !== coop) match = false;

        if (match && text) {
            let matchText = `${mem.name} ${mem.jpName} ${mem.enName||''} ${c.title} ${c.skills?.sp||''} ${c.skills?.active||''} ${c.skills?.passive||''} ${c.skills?.costumeName||''} ${c.skills?.costume||''} ${c.skills?.coop||''}`.toLowerCase().includes(text);
            if (!matchText) match = false;
        }

        if (match && maxStat !== 'all') {
            const getS = (v) => parseInt((v||"0").toString().replace(/,/g, '')) || 0;
            const e = getS(c.maxStats?.expression); const s = getS(c.maxStats?.skill); const t = getS(c.maxStats?.taste);
            const mx = Math.max(e, s, t);
            if (maxStat === 'expression' && e !== mx) match = false;
            if (maxStat === 'skill' && s !== mx) match = false;
            if (maxStat === 'taste' && t !== mx) match = false;
        }

        if (match && (outfitStat !== 'all' || outfitScore !== 'all' || outfitGen !== 'all')) {
            const clothDesc = ((c.skills?.costume || "") + (c.skills?.costumeJp || "") + (c.skills?.costumeEn || "") + (c.skills?.passive || "")).toLowerCase();
            
            if (outfitStat !== 'all') {
                if (outfitStat === 'expression' && !clothDesc.match(/表現力|パフォーマンス|expression/i)) match = false;
                if (outfitStat === 'skill' && !clothDesc.match(/技巧|テクニック|skill/i)) match = false;
                if (outfitStat === 'taste' && !clothDesc.match(/品味|センス|taste/i)) match = false;
                if (outfitStat === 'allStats' && !clothDesc.match(/全能力|全パラメータ|all stats/i)) match = false;
            }
            if (outfitScore !== 'all') {
                if (outfitScore === 'pure' && !clothDesc.match(/清純|ピュア|pure/i)) match = false;
                if (outfitScore === 'cute' && !clothDesc.match(/可愛|キュート|cute/i)) match = false;
                if (outfitScore === 'happy' && !clothDesc.match(/快樂|ハッピー|happy/i)) match = false;
                if (outfitScore === 'allType' && !clothDesc.match(/全體|全員|all members/i)) match = false;
            }
            if (outfitGen !== 'all') {
                if (outfitGen === 'multi_pure' && !clothDesc.match(/2名以上.*(?:清純|ピュア|pure)|(?:清純|ピュア|pure).*2名以上|複數清純/i)) match = false;
                if (outfitGen === 'multi_happy' && !clothDesc.match(/2名以上.*(?:快樂|ハッピー|happy)|(?:快樂|ハッピー|happy).*2名以上|複數快樂/i)) match = false;
                if (outfitGen === 'multi_cute' && !clothDesc.match(/2名以上.*(?:可愛|キュート|cute)|(?:可愛|キュート|cute).*2名以上|複數可愛/i)) match = false;
                if (outfitGen === 'multi_gen' && !clothDesc.match(/2名以上.*(?:期生|gamers|ゲーマーズ|myth|promise|advent|regloss|holox|同屬)|(?:期生|gamers|ゲーマーズ|myth|promise|advent|regloss|holox|同屬).*2名以上|複數同期生/i)) match = false;
                if (outfitGen === 'multi' && !clothDesc.match(/2名以上|複數|複数/i)) match = false;
            }
        }

        return match;
    });
}

function getEliteTeam(leaderCostume, leaderMember) {
    let buffExp=0, buffSkl=0, buffTst=0, buffAll=0, reqType=null, reqGen=null;
    let lCloth = leaderCostume.skills?.costume || "";
    if (lCloth.match(/快樂|ハッピー|Happy/i)) reqType = "happy"; if (lCloth.match(/清純|ピュア|Pure/i)) reqType = "pure"; if (lCloth.match(/可愛|キュート|Cute/i)) reqType = "cute";
    let genMatch = lCloth.match(/\d+期生|GAMERS|ゲーマーズ|Myth|Promise|Advent|ReGLOSS|holoX/i); if (genMatch) reqGen = genMatch[0].toLowerCase();
    let mExp = lCloth.match(/(?:表現力|パフォーマンス|Expression|Performance)[^\d]*(\d+)%/); if(mExp) buffExp = parseInt(mExp[1]);
    let mSkl = lCloth.match(/(?:技巧|テクニック|Skill|Technique)[^\d]*(\d+)%/); if(mSkl) buffSkl = parseInt(mSkl[1]);
    let mTst = lCloth.match(/(?:品味|センス|Taste|Sense)[^\d]*(\d+)%/); if(mTst) buffTst = parseInt(mTst[1]);
    let mAll = lCloth.match(/(?:全能力|全パラメータ|All Stats)[^\d]*(\d+)%/); if(mAll) buffAll = parseInt(mAll[1]);
    buffExp+=buffAll; buffSkl+=buffAll; buffTst+=buffAll;
    const getStat = (val, r) => { let p = parseInt((val||"").toString().replace(/,/g, '')); return isNaN(p) ? (r===5?8640:r===4?6000:4000) : p; };
    let cands = [];
    holoDatabase.forEach(g => g.members.forEach(m => (m.costumes||[]).forEach(c => {
        if(c.id === leaderCostume.id) return;
        let r=c.rarity||3, st=c.maxStats||{}, e=getStat(st.expression,r), s=getStat(st.skill,r), ta=getStat(st.taste,r);
        let pScore = Math.floor((e*(1+buffExp/100) + s*(1+buffSkl/100) + ta*(1+buffTst/100))/100);
        let syn = (reqType&&c.type===reqType?80:c.type===leaderCostume.type?20:0) + (reqGen&&g.genName.toLowerCase().includes(reqGen)?80:0);
        let ps = c.skills?.passive||"", pasBon=0;
        let pScM = ps.match(/分數加成效果[^\d]*(\d+)%/); if(pScM) pasBon+=parseInt(pScM[1])*8;
        cands.push({ m, c, score: pScore+syn+pasBon });
    })));
    cands.sort((a,b)=>b.score-a.score);
    let final=[], chosen=new Set(), selfAdded=false, tgCnt=allowSelfInTeam?4:5;
    for(let i=0; i<cands.length && final.length<tgCnt; i++) {
        let cand=cands[i];
        if(cand.m.id === leaderMember.id) { if(!allowSelfInTeam||selfAdded) continue; final.push(cand); selfAdded=true; }
        else { if(!chosen.has(cand.m.id)) { final.push(cand); chosen.add(cand.m.id); } }
    }
    return final;
}

function openInlineEdit(fieldPath, label) {
    document.getElementById('inlineEditTitle').innerText = "✏️ 編輯: " + label;
    document.getElementById('inlineEditFieldKey').value = fieldPath;

    if(fieldPath === 'imgUrl' || fieldPath === 'signedImgUrl') {
        document.getElementById('inlineEditGroupJp').style.display = 'none';
        document.getElementById('inlineEditGroupEn').style.display = 'none';
        document.getElementById('inlineEditBaseLabel').innerText = "圖片網址";
    } else {
        document.getElementById('inlineEditGroupJp').style.display = 'flex';
        document.getElementById('inlineEditGroupEn').style.display = 'flex';
        document.getElementById('inlineEditBaseLabel').innerText = "基礎 / 中文";
    }

    let parts = fieldPath.split('.');
    let baseVal = "", jpVal = "", enVal = "";

    if(parts[0] === 'bloomBonuses') {
        let idx = parseInt(parts[1]) - 1; 
        baseVal = selectedCostume.bloomBonuses?.[idx] || "";
        jpVal = selectedCostume.bloomBonusesJp?.[idx] || "";
        enVal = selectedCostume.bloomBonusesEn?.[idx] || "";
    } else if(parts.length === 1) {
        baseVal = selectedCostume[parts[0]] || "";
        jpVal = selectedCostume[parts[0] + "Jp"] || "";
        enVal = selectedCostume[parts[0] + "En"] || "";
    } else {
        baseVal = selectedCostume.skills?.[parts[1]] || "";
        jpVal = selectedCostume.skills?.[parts[1] + "Jp"] || "";
        enVal = selectedCostume.skills?.[parts[1] + "En"] || "";
    }

    document.getElementById('inlineEditBase').value = baseVal;
    document.getElementById('inlineEditJp').value = jpVal;
    document.getElementById('inlineEditEn').value = enVal;

    document.getElementById('inlineEditModal').style.display = 'flex';
}

function saveInlineEditModal() {
    let fieldPath = document.getElementById('inlineEditFieldKey').value;
    let parts = fieldPath.split('.');
    let baseVal = document.getElementById('inlineEditBase').value;
    let jpVal = document.getElementById('inlineEditJp').value;
    let enVal = document.getElementById('inlineEditEn').value;

    if(parts[0] === 'bloomBonuses') {
        let idx = parseInt(parts[1]) - 1;
        if(!selectedCostume.bloomBonuses) selectedCostume.bloomBonuses = [];
        if(!selectedCostume.bloomBonusesJp) selectedCostume.bloomBonusesJp = [];
        if(!selectedCostume.bloomBonusesEn) selectedCostume.bloomBonusesEn = [];
        selectedCostume.bloomBonuses[idx] = baseVal;
        selectedCostume.bloomBonusesJp[idx] = jpVal;
        selectedCostume.bloomBonusesEn[idx] = enVal;
    } else if(parts.length === 1) {
        selectedCostume[parts[0]] = baseVal;
        if(fieldPath !== 'imgUrl' && fieldPath !== 'signedImgUrl') {
            selectedCostume[parts[0] + "Jp"] = jpVal;
            selectedCostume[parts[0] + "En"] = enVal;
        }
    } else {
        if(!selectedCostume.skills) selectedCostume.skills = {};
        selectedCostume.skills[parts[1]] = baseVal;
        selectedCostume.skills[parts[1] + "Jp"] = jpVal;
        selectedCostume.skills[parts[1] + "En"] = enVal;
    }

    saveDatabaseToStorage();
    updateView();
    closeInlineEditModal();
}

function importDataJson(e) { 
    const f=e.target.files[0]; if(!f)return; const r=new FileReader(); 
    r.onload=function(ev){ 
        try{ 
            const importedMap = JSON.parse(ev.target.result);
            if (Array.isArray(importedMap)) { 
                holoDatabase = importedMap; 
                alert("舊版完整資料庫覆蓋匯入成功！系統設定與更新紀錄保持不變捏。"); 
            } else if (importedMap.db) {
                holoDatabase = importedMap.db;
                if(importedMap.settings) systemSettings = importedMap.settings;
                if(importedMap.logs) updateLogs = importedMap.logs;
                saveSystemSettingsToStorage();
                saveUpdateLogs();
                alert("✨ 全新綜合備份匯入成功喵！(包含資料庫、設定、更新紀錄)");
            } else {
                let addedCount = 0, updatedCount = 0;
                for (const gen of holoDatabase) {
                    for (const mem of gen.members) {
                        if (importedMap[mem.id] && Array.isArray(importedMap[mem.id])) {
                            if (!mem.costumes) mem.costumes = [];
                            importedMap[mem.id].forEach(newCostume => {
                                const existingIndex = mem.costumes.findIndex(c => c.title === newCostume.title);
                                if (existingIndex !== -1) { 
                                    newCostume.id = mem.costumes[existingIndex].id; 
                                    mem.costumes[existingIndex] = newCostume; 
                                    updatedCount++; 
                                } else { 
                                    mem.costumes.push(newCostume); 
                                    addedCount++; 
                                }
                            });
                        }
                    }
                }
                alert(`✨ 局部匯入成功！\n新增了 ${addedCount} 套，更新了 ${updatedCount} 套！`);
            }
            saveDatabaseToStorage(); updateView(); renderUpdateLogList(); renderHeaderDate();
        }catch(err){
            alert("讀取失敗！檔案格式錯誤！");
        } 
        document.getElementById('importJsonFile').value=''; 
    }; 
    r.readAsText(f); 
}
